<!doctype html>
<html lang="en">

<body>
<title>Archive Paradis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Mystery+Quest&family=Silkscreen:wght@400;700&family=Shrikhand&display=swap">
<style id="page-style">
/* Layout: a teenage scrapbook. Hot-pink lined notebook paper covered in pen doodles; the colour wheel sits in a
   y2k computer window with leopard-print sides; photos are glued onto the page with stars, stickers and captions.
   Deliberately single light theme: everything is drawn on pink paper. */
:root {
  --paper: #f7b6d2; --paper-2: #f29cc3; --rule: rgb(96 104 214 / .30); --margin: rgb(214 40 74 / .45);
  --ink: #1d1420; --pen: #e1304e; --white: #fffafc; --title-fill: #fffafc; --muted: #6d3f58;
  --pixel-blue: #5b5ce8; --silver: #c9c9ce; --silver-hi: #f1f1f4; --silver-lo: #7c7c84;
  --wheel: #fff1f7; --pick: #e1304e;
  --chunky: "Bowlby One", "Arial Black", Impact, sans-serif;
  --marker: "Mystery Quest", "Bradley Hand", Georgia, cursive;
  --pen-font: "Mystery Quest", "Bradley Hand", Georgia, cursive;
  --brown: #4b2e22; --stitch: #3b2418;
  --pixel: "Silkscreen", "Courier New", ui-monospace, monospace;
  --groovy: "Shrikhand", "Cooper Black", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--paper); overflow-x: clip; }
body {
  margin: 0; padding: 0 16px; position: relative; overflow-x: hidden; color: var(--ink);
  font: 400 20px/1.3 var(--pen-font); font-synthesis: none;
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px),
    repeating-linear-gradient(-62deg, transparent 0 22px, rgb(0 0 0 / .035) 22px 34px, transparent 34px 51px),
    repeating-linear-gradient(-58deg, transparent 0 37px, rgb(255 255 255 / .2) 37px 46px, transparent 46px 80px);
}
@media (min-width: 760px) {
  body { background-image:
    linear-gradient(90deg, transparent 56px, var(--margin) 56px 58px, transparent 58px 62px, var(--margin) 62px 63px, transparent 63px),
    repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px),
    repeating-linear-gradient(-62deg, transparent 0 22px, rgb(0 0 0 / .035) 22px 34px, transparent 34px 51px),
    repeating-linear-gradient(-58deg, transparent 0 37px, rgb(255 255 255 / .2) 37px 46px, transparent 46px 80px); }
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }
#doodles { position: absolute; left: 0; top: 0; width: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
#doodles svg { position: absolute; overflow: visible; }

/* Top line */
.top { display: flex; align-items: center; gap: 18px; padding-block: 18px 0; }
.heart-logo { width: 34px; height: 32px; flex: none; }
.heart-logo path { fill: var(--pick); stroke: var(--ink); stroke-width: 2.2; transition: fill .25s; }
.top .hi { font: 400 24px/1 var(--marker); margin-right: auto; color: var(--brown); }
.link { background: none; border: 0; padding: 4px 2px; cursor: pointer; font: 400 24px/1 var(--marker); color: var(--brown); text-decoration: underline wavy var(--pen) 1.5px; text-underline-offset: 6px; }
.link:hover { color: var(--pen); }

/* Title */
.title { text-align: center; padding-block: 8px 30px; position: relative; }
.title .by { font: 400 clamp(24px, 4.4vw, 40px)/1 var(--marker); margin: 0 0 4px; color: var(--brown); letter-spacing: .01em; }
.title h1 { margin: 0; font: 400 clamp(46px, 12.5vw, 138px)/1 var(--chunky); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance;
  color: var(--title-fill); filter: url(#cut-edge) drop-shadow(3px 4px 0 rgb(59 36 24 / .28)); }
/* every letter is cut from a different fabric, outlined in dark thread */
.title h1 .lt { display: inline-block; color: transparent; -webkit-background-clip: text; background-clip: text; background-size: var(--ps, 60px);
  -webkit-text-stroke: clamp(2px, .45vw, 4px) var(--stitch); padding: 0 .01em; rotate: var(--r, 0deg); translate: 0 var(--y, 0); filter: saturate(1.22) contrast(1.03); }
body.editing .title h1 [data-k] { color: var(--title-fill); -webkit-text-stroke: 2px var(--stitch); }
.title h1 span { display: inline-block; }
.title .sub { font: 400 clamp(24px, 4.4vw, 40px)/1 var(--marker); margin: 16px 0 0; color: var(--brown); }
.title .sub b { color: var(--brown); font-weight: 400; }
.title .stripe { position: absolute; width: clamp(54px, 9vw, 92px); height: auto; }
.stripe.l { left: 4px; top: 54%; rotate: -14deg; } .stripe.r { right: 6px; top: 18%; rotate: 12deg; }

/* Coupon (info) */
.coupon { border: 3px dashed var(--ink); background: rgb(255 250 252 / .82); padding: 18px 20px; margin: 0 auto 28px; max-width: 760px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; rotate: -.6deg; }
.coupon h2 { font: 700 15px/1.2 var(--pixel); letter-spacing: .04em; margin: 0 0 10px; text-transform: uppercase; }
.coupon p { margin: 0 0 12px; }
.coupon .line { border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 22px; }
.coupon .line small { font: 400 11px/1 var(--pixel); text-transform: uppercase; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
[data-k], [data-f] { border-radius: 2px; }
body.editing [data-k], body.editing [data-f] { outline: 2px dashed var(--ink); outline-offset: 3px; cursor: text; background: rgb(255 255 255 / .35); }
body.editing [data-k]:focus, body.editing [data-f]:focus { outline-style: solid; background: rgb(255 255 255 / .7); }
body.editing { padding-bottom: 150px; }
body.editing .toast { bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }

/* Edit bar (only for people who can edit) */
.editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--white); font: 400 12px/1.2 var(--pixel); text-transform: uppercase;
  box-shadow: 0 -4px 0 var(--pen); }
.eb-title { font-weight: 700; font-size: 14px; color: var(--paper); }
.eb-hint { text-transform: none; font: 400 17px/1 var(--pen-font); margin-right: auto; }
.eb-col { display: flex; align-items: center; gap: 6px; }
.eb-col input { width: 34px; height: 26px; padding: 0; border: 2px solid var(--white); background: none; cursor: pointer; }
.eb-meter { color: var(--silver); }
.eb-save { background: var(--paper); }
.eb-save.dirty { background: var(--pen); color: var(--white); }
.tools { position: absolute; left: 6px; top: 6px; z-index: 4; display: flex; gap: 4px; }
.tools .px { padding: 5px 7px; font-size: 10px; }
.foot { text-align: center; font: 400 24px/1.2 var(--marker); color: var(--brown); padding-block: 0 48px; }

/* y2k silver button */
.px {
  font: 700 13px/1 var(--pixel); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; color: var(--ink);
  background: var(--silver); padding: 9px 12px; border: 3px solid; border-color: var(--silver-hi) var(--silver-lo) var(--silver-lo) var(--silver-hi);
}
.px:active { border-color: var(--silver-lo) var(--silver-hi) var(--silver-hi) var(--silver-lo); }

/* Computer window */
.window { max-width: 760px; margin: 0 auto; background: var(--ink); border: 3px solid var(--ink); box-shadow: 8px 8px 0 rgb(29 20 32 / .85); rotate: .5deg; }
.titlebar { color: var(--white); font: 400 clamp(11px, 2.4vw, 16px)/1 var(--pixel); display: flex; justify-content: space-between; gap: 12px; padding: 9px 8px 8px; text-transform: uppercase; }
.panes { display: grid; grid-template-columns: minmax(36px, 1fr) minmax(0, 3.4fr) minmax(36px, 1fr); gap: 3px; }
.leopard { background-color: #dca867; background-size: 210px 210px; }
.screen { background: var(--white); display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 18px; align-items: center; padding: 18px; }
.wheel-box { position: relative; width: 100%; max-width: 250px; aspect-ratio: 1; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; justify-self: center; }
.wheel-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
.handle { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid var(--ink); background: var(--pick); pointer-events: none; }
.halo { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 2px dashed var(--ink); pointer-events: none; }
.readout { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hint { margin: 0; font: 400 23px/1.1 var(--marker); color: var(--brown); }
.hint b { color: var(--pen); font-weight: 400; }
.nums { font: 400 13px/1 var(--pixel); display: flex; gap: 14px; flex-wrap: wrap; }
.hexrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 400 14px/1 var(--pixel); }
.hexrow .sw { width: 20px; height: 20px; background: var(--pick); border: 2px solid var(--ink); }
.match { font: 400 19px/1 var(--pen-font); color: var(--muted); }
.transport { margin-top: 3px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.transport .px { padding: 7px 0; font-size: 15px; letter-spacing: -.12em; }
.bottom { display: grid; grid-template-columns: minmax(36px, 1fr) minmax(0, 3.4fr) minmax(36px, 1fr); gap: 3px; margin-top: 3px; }
.bigbtn { font: 700 clamp(11px, 2.6vw, 20px)/1 var(--pixel); text-transform: uppercase; border: 0; cursor: pointer; padding: 10px 4px; color: var(--ink); }
.bigbtn.blue { background: var(--pixel-blue); }
.bigbtn.grey { background: var(--silver); }
.ticker { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; padding: 8px 6px; }
.ticker button { background: none; border: 0; color: var(--white); font: 400 clamp(11px, 2.2vw, 14px)/1 var(--pixel); cursor: pointer; padding: 2px; text-transform: uppercase; }
.ticker button:hover, .ticker button[aria-pressed="true"] { color: var(--paper); text-decoration: underline; }

/* Photos glued onto the page */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 56px 34px; padding-block: 64px 90px; }
@media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 16px; } }
.card { position: relative; margin: 0; padding: 0; text-align: center; display: block; width: 100%;
  rotate: var(--tilt, 0deg); translate: 0 var(--drop, 0px); transition: rotate .3s, scale .3s; }
.card .pic, .card .dots { transition: filter .4s; }
.card:hover { rotate: 0deg; scale: 1.04; z-index: 3; }
.card.far .pic, .card.far .dots { filter: saturate(.2) brightness(1.08) contrast(.85); }
.card.far .cap { color: var(--muted); }
.card .pic { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; box-shadow: 2px 3px 0 rgb(29 20 32 / .18), 0 10px 18px rgb(120 30 70 / .18); }
.card img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.card .cap { display: block; margin-top: 8px; font: 400 21px/1.1 var(--pen-font); color: var(--brown); }
.card .dots { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
.card .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); }
.star { position: absolute; top: -20px; right: -14px; width: 50px; height: 50px; z-index: 2; }
.star text { font: 400 18px var(--chunky); }
/* craft stickers: rhinestones, paper stars, die-cut butterflies, flowers, jelly hearts */
.deco { position: absolute; z-index: 2; pointer-events: none; height: auto; overflow: visible; rotate: var(--dr, 0deg); }
.deco.flat { filter: drop-shadow(0 1px .6px rgb(70 30 40 / .35)) drop-shadow(1px 2px 2px rgb(70 30 40 / .18)); }
.deco.raised { filter: drop-shadow(0 1.5px 1px rgb(40 15 30 / .45)) drop-shadow(1.5px 3px 3px rgb(40 15 30 / .25)); }
.add { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; aspect-ratio: 4 / 5; width: 100%; cursor: pointer;
  border: 3px dashed var(--ink); background: rgb(255 250 252 / .55); font: 400 19px/1.15 var(--pen-font); color: var(--brown); rotate: 1.5deg; padding: 10px; }
.add strong { font: 400 30px/1 var(--marker); color: var(--pen); }
.add:hover { background: rgb(255 250 252 / .85); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 92%, transparent); font: 400 40px/1 var(--marker); border: 4px dashed var(--ink); }
.lb { position: fixed; inset: 0; z-index: 40; background: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px);
  display: flex; flex-direction: column; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.lb .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lb .count { font: 400 26px/1 var(--marker); margin-right: auto; }
.lb .stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.lb .stage img { max-width: 100%; max-height: 100%; object-fit: contain; rotate: -1deg; box-shadow: 3px 4px 0 rgb(29 20 32 / .25); }
.lb .cap { text-align: center; font: 400 26px/1.1 var(--pen-font); color: var(--brown); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--white); border: 2px solid var(--ink); padding: 4px 9px 4px 4px; font: 400 12px/1 var(--pixel); cursor: pointer; }
.chip span { width: 18px; height: 18px; border: 1.5px solid var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 60; background: var(--ink); color: var(--white);
  font: 400 13px/1 var(--pixel); padding: 11px 14px; text-transform: uppercase; box-shadow: 4px 4px 0 var(--pen); }

@media (max-width: 640px) {
  .eb-hint { display: none; }
  .title { padding-top: 14px; }
  .title .by { margin-bottom: 12px; }
  .title h1 { font-size: 11.2vw; line-height: 1.08; }
  .title .stripe { width: 44px; }
  .stripe.l { left: -4px; top: 76%; } .stripe.r { right: -2px; top: -6px; }
  .screen { grid-template-columns: minmax(0, 1fr); padding: 14px; gap: 12px; }
  .wheel-box { max-width: 210px; }
  .readout { align-items: center; text-align: center; }
  .coupon { grid-template-columns: minmax(0, 1fr); }
  .card .cap { font-size: 18px; }
  .deco.main { scale: .72; }
  .star { width: 42px; height: 42px; right: -10px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { scale: 1; } }
</style>

<script id="page-app">
(() => {
  /* ---------- the page is built from its own source, so Save can republish it ---------- */
  const shell = document.getElementById("page-shell");
  const SOURCE = {
    style: document.getElementById("page-style").outerHTML,
    shell: shell.outerHTML,
    app: document.getElementById("page-app").outerHTML,
    links: [...document.querySelectorAll("link")].filter((l) => /fonts\.g/.test(l.href)).map((l) => l.outerHTML).join("\n")
  };
  shell.before(shell.content.cloneNode(true));

  const $ = (s) => document.querySelector(s);
  const grid = $("#grid");
  let photos = [];                 // {id, src, w, h, palette, pts, sample?, added, score}
  let pick = { x: 0.62, y: 0.48 }; // handle position in unit-disc coordinates (x right, y up)

  /* ---------- tiny seeded random, so doodles stay put between visits ---------- */
  const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };

  /* ---------- the archive's content lives in the page itself ---------- */
  let state;
  try { state = JSON.parse(document.getElementById("archive-data").textContent); } catch { state = {}; }

    }
  }
  for (const k of Object.keys(THEME)) $("#c-" + k).addEventListener("input", (e) => { state.theme[k] = e.target.value; applyTheme(); changed(); });

  /* ---------- edit mode ---------- */
  let editing = false, art = null, dirty = false;
  const CE = (() => { const d = document.createElement("div"); d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only" ? "plaintext-only" : "true"; })();
  function applyEditable() {
    document.querySelectorAll("[data-k], [data-f]").forEach((el) => {
      if (editing) { el.contentEditable = CE; el.spellcheck = false; } else el.removeAttribute("contenteditable");
    });
    decorateTitle();
  }
  function serial() {
    const real = photos.filter((p) => !p.sample).map((p) => ({ id: p.id, src: p.src, caption: p.caption ?? null, sticker: p.sticker ?? "", sc: p.sc ?? 0 }));
    return JSON.stringify({ v: 1, text: state.text, theme: state.theme, photos: real });
  }
  let changedTimer = 0;
  function changed() {
    clearTimeout(changedTimer);
    changedTimer = setTimeout(() => {
      const now = serial(); dirty = now !== saved;
      const b = $("#eb-save"); b.classList.toggle("dirty", dirty); b.textContent = dirty ? "Save ♡" : "Saved";
      $("#eb-meter").textContent = `${(now.length / 1e6).toFixed(1)} / ${LIMIT / 1e6} MB`;
    }, 150);
  }
  function setEditing(on) {
    editing = on; stopPlay();
    document.body.classList.toggle("editing", on);
    $("#editbar").hidden = !on; $("#edit-btn").textContent = on ? "✎ editing" : "✎ edit";
    if (on) { $("#info").hidden = false; $("#info-btn").setAttribute("aria-expanded", "true"); }
    render(); changed();
  }
  $("#edit-btn").addEventListener("click", () => setEditing(!editing ? true : (dirty ? (toast("save first, or tap undo all"), true) : false)));
  $("#eb-done").addEventListener("click", () => dirty ? toast("save first, or tap undo all") : setEditing(false));
  $("#eb-undo").addEventListener("click", async () => {
    state = JSON.parse(saved); state.text ||= {}; state.theme ||= {};
    applyText(); applyTheme(); await buildPhotos(); render(); changed(); toast("back to the last save");
  });
  document.addEventListener("input", (e) => {
    if (!editing || !(e.target instanceof Element)) return;
    const k = e.target.closest("[data-k]");
    if (k) { state.text[k.dataset.k] = k.textContent; changed(); return; }
    const f = e.target.closest("[data-f]"); if (!f) return;
    const p = photos.find((x) => x.id === f.closest(".card")?.dataset.id); if (!p) return;
    if (f.dataset.f === "caption") p.caption = f.textContent.trim() || null;
    else p.sticker = f.textContent.trim();
    changed();
  });
  document.addEventListener("keydown", (e) => {
    if (editing && e.key === "Enter" && e.target instanceof Element && e.target.closest("[data-k], [data-f]")) { e.preventDefault(); e.target.blur(); }
  }, true);
  // a click on editable text inside a button edits the text instead of pressing the button
  document.addEventListener("click", (e) => {
    if (editing && e.target instanceof Element && e.target.closest("button [data-k]")) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* ---------- saving: the page republishes itself with the new content ---------- */
  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#faf9f7}img{max-width:100%}[hidden]{display:none!important}";
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function buildDocument() {
    const t = (k) => (typeof state.text[k] === "string" ? state.text[k] : DEFAULT_TEXT[k]).trim();
    const title = (t("t1") + " " + t("t2")).replace(/(^|\s)\S/g, (c) => c.toUpperCase());
    const json = serial().replace(/</g, "\\u003c");
    return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body><title>${esc(title)}</title>\n${SOURCE.links}\n${SOURCE.style}\n\n${SOURCE.shell}\n<script type="application/json" id="archive-data">${json}</` + `script>\n${SOURCE.app}\n</body></html>`;
  }
  async function save() {
    if (!dirty) return toast("nothing new to save");
    const html = buildDocument();
    if (html.length > LIMIT + 9e5) return toast("too big to save, take a few photos out");
    const b = $("#eb-save");
    if (!art) {   // a copy hosted somewhere else: hand over the updated file instead
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = "index.html";
      document.body.appendChild(a); a.click(); a.remove();
      saved = serial(); changed();
      return toast("downloaded index.html, upload it to your site");
    }
    b.disabled = true; b.textContent = "Saving…";
    try {
      await art.publish(html);
      saved = serial(); toast("saved ♡ everyone sees the new version");
    } catch (e) {
      const code = e && e.code;
      if (code === "conflict") toast("a newer version was saved somewhere else, loading it…");
      else if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].includes(code)) {
        toast("this view can't save changes"); $("#edit-btn").hidden = true;
      } else if (code === "too_large") toast("too big to save, take a few photos out");
      else if (code === "rate_limited") toast("saving too fast, wait a minute then try again");
      else toast("couldn't save right now, try again in a moment");
    } finally { b.disabled = false; changed(); }
  }
  $("#eb-save").addEventListener("click", save);

  /* ---------- info + copying ---------- */
  $("#info-btn").addEventListener("click", (e) => { const open = $("#info").hidden; $("#info").hidden = !open; e.currentTarget.setAttribute("aria-expanded", String(open)); lastDoodleH = 0; drawDoodles(); });
  let tt;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
  function copy(text, msg) {
    const fallback = () => { const n = document.createElement("textarea"); n.value = text; n.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(n); n.select(); try { document.execCommand("copy"); toast(msg); } catch { toast("select it + copy it"); } n.remove(); };
    try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch { fallback(); }
  }
  $("#copy-email").addEventListener("click", () => { if (!editing) copy($("#email").textContent.trim(), "email copied"); });
  $("#copy-hex").addEventListener("click", () => copy($("#hex").textContent, `copied ${$("#hex").textContent}`));

  /* ---------- boot ---------- */
  async function loadSamples() { photos = await Promise.all(SAMPLES.map((s, i) => hydrate({ id: "sample" + i, sample: true, ...drawSample(s, i + 1) }))); }
  async function buildPhotos() {
    const list = (state.photos || []).filter((p) => p && typeof p.src === "string" && p.src.startsWith("data:image/")).map((p) => ({ ...p }));
    photos = (await Promise.all(list.map((p) => hydrate(p).catch(() => null)))).filter(Boolean);
    if (!photos.length) await loadSamples();
  }
  const tile = cheetahTile();
  FABRICS = fabricTiles();
  document.querySelectorAll(".leopard").forEach((el) => el.style.backgroundImage = `url(${tile})`);
  stripedHeart(document.querySelector(".stripe.l"), 11); stripedHeart(document.querySelector(".stripe.r"), 23);
  new ResizeObserver(() => drawDoodles()).observe(document.body);
  applyText(); applyTheme();
  (async () => {
    try { const s = JSON.parse(store.get("pick") || "null"); if (s && isFinite(s.x) && isFinite(s.y)) pick = s; } catch {}
    setPick(pick.x, pick.y, false);
    await buildPhotos();
    saved = serial();
    render(); setPick(pick.x, pick.y, false);
  })();
  // Who may edit: inside Claude, people with edit access to this page. A copy hosted elsewhere: add #edit to the address.
  (async () => {
    let can = false;
    if (window.claude && typeof window.claude.use === "function") {
      const [a, u] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
      art = a; can = !!a && !!u && await u.canEdit();
    } else can = location.hash === "#edit";
    $("#edit-btn").hidden = !can;
  })();
})();
</script>

</body>
</html>
